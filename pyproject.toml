[project]
name = "inside-the-block"
version = "0.1.0"
description = "Measure how Solana mainnet leaders order transactions"
requires-python = ">=3.11"
dependencies = [
  "solders==0.29.0",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "websockets==15.0.1",
]

[project.optional-dependencies]
analysis = ["matplotlib==3.11.2"]
dev = ["pytest"]

[project.scripts]
itb = "itb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
